name: CI

# Verify (the verify command, then the end-to-end tests) on every pull request and every push to
# main, then the merge of low-risk Dependabot updates (GitHub Actions) once it passes. The ruleset
# requires the job names; keep them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: node scripts/dev-process/check-process.mjs
      # Each check is its own step, with no continue-on-error, so the failing one names itself
      # (docs/PROCESS.md, Testing).
      - name: Install
        run: npm ci
        working-directory: app
      - name: Format (Prettier)
        run: npm run format:check
        working-directory: app
      - name: Lint (ESLint)
        run: npm run lint
        working-directory: app
      - name: Types (tsc)
        run: npm run typecheck
        working-directory: app
      - name: Unit and component tests (Vitest)
        run: npm test
        working-directory: app
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
        working-directory: app

  dependabot:
    name: Merge Dependabot update
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
