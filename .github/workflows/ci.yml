name: CI

# Verify (the verify command's checks, the dependency audit, migrate.sh against a Postgres
# service, then the end-to-end tests) on every pull request and every push to main, then the merge
# of low-risk Dependabot updates (GitHub Actions) once it passes. npm and Docker updates wait for
# review (docs/PROCESS.md, Upgrades). The ruleset requires the job names; keep them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # A bare cluster for migrate.sh and the integration tests. It's disposable, so the migrate
    # test's password-rotation case runs here only. The tag matches docker-compose.yml's, and
    # Dependabot doesn't read workflow services: bump the two together, by hand.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    # What app/.env.local holds locally, for CI's cluster. Not secrets: nothing outside this job
    # can reach it.
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-superuser-password
      PGDATABASE: synapse_test
      SYNAPSE_APP_DB_PASSWORD: ci-app-password
      DATABASE_URL: postgresql://synapse_app:ci-app-password@localhost:5432/synapse_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: node scripts/dev-process/check-process.mjs
      - run: node scripts/check-docs.mjs
      # Each check is its own step, with no continue-on-error, so the failing one names itself
      # (docs/PROCESS.md, Testing).
      - name: Install
        run: npm ci
        working-directory: app
      - name: Format (Prettier)
        run: npm run format:check
        working-directory: app
      - name: Lint (ESLint)
        run: npm run lint
        working-directory: app
      - name: Types (tsc)
        run: npm run typecheck
        working-directory: app
      - name: Dependency audit (runtime)
        run: npm run check:audit
        working-directory: app
      # Both databases, as the migrate service does on an empty volume, so every run proves a
      # first install. The tests then migrate synapse_test again.
      - name: Migrate (migrate.sh)
        run: bash scripts/migrate.sh
        working-directory: app
      - name: Tests (Vitest, unit, component, and integration)
        run: npm test
        working-directory: app
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
        working-directory: app
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14

  dependabot:
    name: Merge Dependabot update
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # GitHub Actions only: npm and Docker updates wait for the owner's review.
      - if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
