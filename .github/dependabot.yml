# Dependabot (docs/PROCESS.md, Upgrades). The Triage workflow assigns each PR to the owner and asks
# for their review. CI merges GitHub Actions updates once Verify passes; npm and Docker updates
# wait for that review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, "type: upgrade"]
    commit-message:
      prefix: Upgrade
    groups:
      actions:
        patterns: ["*"]

  # The app, the repository's only Node package.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    labels: [dependencies, "type: upgrade"]
    commit-message:
      prefix: Upgrade
    # A routine week arrives as two PRs, dev and runtime, and each major as a PR of its own.
    # Dependabot counts a 0.x minor as a minor, though the caret treats it as breaking, so a
    # next-themes or class-variance-authority release outside its range arrives in the runtime
    # group: read those first.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    # The typescript and eslint majors would only fail, and the @types/node major waits for the
    # Node major, so all three are ignored rather than raised every week. Minor and patch updates
    # still arrive.
    ignore:
      # TypeScript 7, the native port, is outside typescript-eslint's peer range, which ends below
      # 6.1. The `//typescript` note in app/package.json is the other half. Lift this once
      # typescript-eslint admits 7, and check that `next build` still type-checks with it: Next
      # 16.4.6 runs the project's own `tsc`, under the still-experimental `useTypeScriptCli`. A 6.1
      # arrives as a minor, moving `~6.0` to `~6.1`: check typescript-eslint's peer range before
      # merging it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ESLint 10 removed the rule-context accessors that the plugins eslint-config-next vendors
      # still call (eslint-plugin-react 7.37.5 peers at ^9.7), so it crashes as it loads the
      # rules. The `//eslint` note in app/package.json says when to lift it.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # @types/node's major moves with the Node major in CI and the images, by hand and in the
      # same change. Ahead of the runtime, `tsc` admits APIs that don't exist; behind it, it
      # rejects ones that do. This rule doesn't lift.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The images' base tags: node in app/Dockerfile, and postgres in docker-compose.yml. Each waits
  # for review, like npm. A postgres bump also needs the same tag in ci.yml's Postgres service,
  # which Dependabot doesn't read, in the same PR. A node major moves with @types/node and CI's
  # node-version, by hand (Upgrades in docs/PROCESS.md).
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    labels: [dependencies, "type: upgrade"]
    commit-message:
      prefix: Upgrade

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "type: upgrade"]
    commit-message:
      prefix: Upgrade
