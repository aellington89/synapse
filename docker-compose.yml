# Synapse's services, after finance-stack's (finance-stack/docker-compose.yml): postgres (the
# data) and migrate (databases, the app's role, Drizzle migrations, and grants, then it exits).
# #4's part 4 adds the app. Every service is named synapse-* and published on loopback only, so
# this stack runs beside finance-stack's (docs/design/phase-1-core-graph.md, §3.1).
#
# Copy .env.example to .env and fill it in, then `docker compose up --build`. The migrate image
# carries app/scripts/ and app/drizzle/, so a change to either needs `--build`.

name: synapse

# finance-stack's logging limits: at most 30 MB of logs per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6
    container_name: synapse-postgres
    restart: unless-stopped
    # What the image needs to initialize an empty volume. The databases themselves come from
    # migrate, so a new one reaches an existing volume too.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5434: finance-stack has 5433, and a local Postgres may have 5432. Loopback only (AC4).
      - "127.0.0.1:5434:5432"
    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker: mount the parent.
      - postgres_data:/var/lib/postgresql
    logging: *default-logging
    healthcheck:
      # Over TCP, not the socket: while initdb runs, the entrypoint's temporary server listens on
      # the socket only, so a socket check could release migrate before the real server is up.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}"']
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  # One-shot: app/scripts/migrate.sh, as the superuser, on every `up`. It's idempotent.
  migrate:
    build:
      context: ./app
      target: migrate
    image: synapse-migrate:latest
    container_name: synapse-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # synapse_app's password, set on every run, so a new one takes effect on the next `up`.
      # migrate.sh stops if it's empty or not URL-safe.
      SYNAPSE_APP_DB_PASSWORD: ${SYNAPSE_APP_DB_PASSWORD}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  postgres_data:
